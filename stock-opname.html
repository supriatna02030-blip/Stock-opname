<!-- TOMBOL MENU -->
<div style="margin:20px 0;">
  <button onclick="showForm()" style="padding:10px 20px; background:blue; color:white; border:none; border-radius:5px;">+ Tambah Barang</button>
  <button onclick="tampilkanData()" style="padding:10px 20px; background:green; color:white; border:none; border-radius:5px;">Lihat Data</button>
</div>

<!-- FORM TAMBAH/EDIT BARANG -->
<div id="formBarang" style="display:none; border:1px solid #ccc; padding:15px; border-radius:5px; margin-bottom:20px;">
  <h3 id="judulForm">Form Tambah Barang</h3>

  <input type="hidden" id="editIndex"> <!-- buat nyimpen index pas edit -->
  <input type="text" id="namaBarang" placeholder="Nama Barang" style="width:90%; padding:8px; margin:5px 0;"><br>
  <input type="number" id="jumlahBarang" placeholder="Jumlah" style="width:90%; padding:8px; margin:5px 0;"><br>

  <button onclick="simpanBarang()" style="padding:10px 20px; background:green; color:white; border:none;">Simpan</button>
  <button onclick="hideForm()" style="padding:10px 20px; background:red; color:white; border:none;">Batal</button>
</div>

<!-- TABEL DATA -->
<div id="tabelData"></div>

<script>
let data = JSON.parse(localStorage.getItem("stockData")) || [];

// TAMPILKAN DATA + TOMBOL EDIT HAPUS
function tampilkanData() {
  let html = "<h3>Data Stock</h3><table border=1 cellpadding=8 style='border-collapse:collapse; width:100%'>";
  html += "<tr style='background:#eee'><th>No</th><th>Nama Barang</th><th>Jumlah</th><th>Aksi</th></tr>";

  data.forEach((d, i) => {
    html += `<tr>
      <td>${i+1}</td>
      <td>${d.nama}</td>
      <td>${d.jumlah}</td>
      <td>
        <button onclick="editData(${i})" style="background:orange; color:white; border:none; padding:5px 10px;">Edit</button>
        <button onclick="hapusData(${i})" style="background:red; color:white; border:none; padding:5px 10px;">Hapus</button>
      </td>
    </tr>`;
  });
  html += "</table>";
  document.getElementById("tabelData").innerHTML = html;
}

// SIMPAN BARU / UPDATE EDIT
function simpanBarang() {
  let nama = document.getElementById("namaBarang").value;
  let jumlah = document.getElementById("jumlahBarang").value;
  let index = document.getElementById("editIndex").value;

  if(nama == "" || jumlah == "") { alert("Isi semua dulu pak"); return; }

  if(index === "") { // tambah baru
    data.push({nama: nama, jumlah: jumlah});
  } else { // update edit
    data[index] = {nama: nama, jumlah: jumlah};
    document.getElementById("editIndex").value = "";
    document.getElementById("judulForm").innerText = "Form Tambah Barang";
  }

  localStorage.setItem("stockData", JSON.stringify(data));
  alert("Data tersimpan");
  hideForm();
  tampilkanData();
  document.getElementById("namaBarang").value = "";
  document.getElementById("jumlahBarang").value = "";
}

// EDIT DATA
function editData(i) {
  document.getElementById("editIndex").value = i;
  document.getElementById("namaBarang").value = data[i].nama;
  document.getElementById("jumlahBarang").value = data[i].jumlah;
  document.getElementById("judulForm").innerText = "Form Edit Barang";
  showForm();
}

// HAPUS DATA
function hapusData(i) {
  if(confirm("Yakin mau hapus " + data[i].nama + "?")) {
    data.splice(i, 1);
    localStorage.setItem("stockData", JSON.stringify(data));
    tampilkanData();
  }
}

function showForm() { document.getElementById("formBarang").style.display = "block"; }
function hideForm() {
  document.getElementById("formBarang").style.display = "none";
  document.getElementById("editIndex").value = "";
  document.getElementById("namaBarang").value = "";
  document.getElementById("jumlahBarang").value = "";
}

// tampilkan data pas buka halaman
tampilkanData();
</script>
