<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Opname PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{font-family:'Poppins', sans-serif}
  body{background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; padding:15px}
.login-box,.container{background:white; padding:30px; border-radius:20px; width:100%; max-width:1100px; box-shadow: 0 10px 30px rgba(0,0,0,0.2)}
  h2{text-align:center; color:#667eea; font-weight:700}
  input,button,select{width:100%; padding:12px; margin:8px 0; border:2px solid #eee; border-radius:10px; box-sizing:border-box; font-size:14px}
  button{background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color:white; border:none; cursor:pointer; font-weight:600; border-radius:10px}
.btn-edit{background: #f39c12; width:auto; padding:5px 12px; margin:2px}
.btn-hapus{background: #e74c3c; width:auto; padding:5px 12px; margin:2px}
.logout{float:right; background: #e74c3c; width:auto; padding:8px 20px}
.filter{display:flex; gap:10px}
.total{margin-top:15px; font-weight:700; background:linear-gradient(135deg, #667eea, #764ba2); color:white; padding:15px; border-radius:15px; text-align:center}
  table{width:100%; border-collapse:collapse; margin-top:15px}
  th,td{padding:12px; text-align:center; border-bottom:1px solid #ddd}
  th{background:#667eea; color:white}
.badge{padding:5px 12px; border-radius:20px; color:white; font-size:12px; font-weight:600}
.badge-RPC{background:#e67e22}.badge-RAW{background:#3498db}.badge-ORI{background:#2ecc71}
  #app{display:none}
.hidden{display:none}
.link-lupa{font-size:13px; text-align:center; margin-top:10px; color:#667eea; cursor:pointer; text-decoration:underline; font-weight:600}
</style>
</head>
<body>

<div class="login-box" id="loginPage">
  <h2>🔐 LOGIN STOCK OPNAME PRO</h2>
  <input type="text" id="username" placeholder="👤 Username" value="admin">
  <input type="password" id="password" placeholder="🔑 Password" value="admin123">
  <button onclick="login()">Masuk Sekarang</button>
  <button onclick="resetData()" style="background:red">🔄 Reset Data</button>
  <p class="link-lupa" onclick="lupaPassword()">Lupa Password?</p>
  <p id="loginError" style="color:red; display:none; text-align:center">Username/Password salah!</p>
</div>

<div class="container" id="app">
  <button class="logout" onclick="logout()">🚪 Logout</button>
  <h2>📊 APLIKASI STOCK OPNAME RPC RAW ORI</h2>
  <p id="userInfo" style="text-align:center; font-weight:600; color:#667eea"></p>

  <h3 id="judulForm">Tambah Barang</h3>
  <div id="formTambah">
    <input type="hidden" id="editIndex" value="">
    <select id="kategoriBarang"><option value="">📁 Pilih Kategori</option><option value="RPC">RPC</option><option value="RAW">RAW</option><option value="ORI">ORI</option></select>
    <input type="text" id="namaBarang" placeholder="📦 Nama Barang">
    <input type="number" id="stokSistem" placeholder="📈 Stok Sistem">
    <button onclick="simpanBarang()">+ Tambah / Update</button>
    <button id="btnBatal" onclick="batalEdit()" style="background:gray; display:none">Batal Edit</button>
  </div>

  <h3>Form Stock Opname</h3>
  <div class="filter">
    <input type="text" id="searchInput" onkeyup="tampilkan()" placeholder="🔍 Cari Nama Barang...">
    <select id="filterKategori" onchange="tampilkan()"><option value="ALL">Semua</option><option value="RPC">RPC</option><option value="RAW">RAW</option><option value="ORI">ORI</option></select>
  </div>
  <input type="date" id="tanggalOpname">
  <button onclick="simpanOpname()">💾 Simpan Opname</button>
  <button onclick="exportExcel()">📤 Export Excel</button>
  <button id="btnGantiPass" onclick="gantiPassword()" style="background:#f39c12">🔑 Ganti Password</button>

  <table id="tabelBarang"></table>
  <div class="total" id="totalStok"></div>
</div>
