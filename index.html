  button{background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color:white; border:none; cursor:pointer; font-weight:600; border-radius:10px}
.btn-reset{background:#e74c3c}
.btn-edit{background: #f39c12; width:auto; padding:5px 12px; margin:2px}
.btn-hapus{background: #e74c3c; width:auto; padding:5px 12px; margin:2px}
.btn-aksi{background:#1abc9c; width:auto; padding:8px 15px; margin:5px}

.btn-riwayat:hover{background:#dfe6e9}
.filter{display:flex; gap:10px}
.total{margin-top:15px; font-weight:700; background:linear-gradient(135deg, #667eea, #764ba2); color:white; padding:15px; border-radius:15px; text-align:center}
  table{width:100%; border-collapse:collapse; margin-top:15px}
  th,td{padding:12px; text-align:center; border-bottom:1px solid #ddd; font-size:13px}

.badge-RPC{background:#e67e22}.badge-RAW{background:#3498db}.badge-ORI{background:#2ecc71}.badge-LAIN{background:#9b59b6}
.header{display:flex; justify-content:space-between; align-items:center}
#listRiwayat{max-height:250px; overflow-y:auto; border:1px solid #ddd; padding:10px; border-radius:10px; margin-top:10px}
  @media print { body{background:white}.container{box-shadow:none} button{display:none} }

  <h3 id="judulForm">Tambah Barang</h3>
  <div id="formTambah">

    <input type="text" id="namaBarang" placeholder="📦 Nama Barang + Kode">
    <input type="number" id="stokSistem" placeholder="📈 Stok Sistem">
    <button onclick="simpanBarang()">+ Tambah / Update</button>
    <button id="btnBatal" onclick="batalEdit()" style="background:gray; display:none">Batal Edit</button>
    <button onclick="loadTemplate()" style="background:#2ecc71">📥 Load Template Benspot</button>
  </div>

  <h3>Form Stock Opname</h3>
  <div class="filter">
    <input type="text" id="searchInput" onkeyup="tampilkan()" placeholder="🔍 Cari Nama Barang...">
    <select id="filterKategori" onchange="tampilkan()"><option value="ALL">Semua</option><option value="RPC">RPC</option><option value="RAW">RAW</option><option value="ORI">ORI</option><option value="LAIN">LAIN-LAIN</option></select>
  </div>
  <input type="date" id="tanggalOpname">

  <div style="display:flex; gap:10px; flex-wrap:wrap">
    <button class="btn-aksi" onclick="simpanOpname()">💾 Simpan Opname</button>
    <button class="btn-aksi" onclick="exportExcel()">📤 Export Excel</button>
    <button class="btn-aksi" onclick="window.print()">🖨️ Print PDF</button>
  </div>

  <h3>📜 Riwayat Opname</h3>
  <div id="listRiwayat"></div>
  <button onclick="hapusRiwayatTerpilih()" style="background:#e74c3c; margin-top:10px">🗑️ Hapus Riwayat Terpilih</button>
  <div id="infoRiwayat" style="color:#667eea; font-weight:600; margin-top:10px"></div>

  <table id="tabelBarang"></table>
  <div class="total" id="totalStok"></div>
</div>

let dataBarang = [];

function simpanData(){ sessionStorage.setItem('dataBarang', JSON.stringify(dataBarang)); }
function loadData(){ dataBarang = JSON.parse(sessionStorage.getItem('dataBarang')) || []; }

function resetData(){
  if(confirm('Yakin reset SEMUA data dan riwayat?')){
    sessionStorage.clear();
    alert('Data dihapus!'); location.reload();
  }
}

function loadTemplate(){
  if(confirm('Load 57 item template Benspot? Data lama akan tertimpa')){
    dataBarang = templateBenspot.map(item => ({...item, stokSistem: item.sistem, stokFisik: item.fisik}));
    tampilkan(); tampilkanDaftarRiwayat(); alert('Template Benspot 57 item berhasil dimuat!');
  }
}

function tampilkan() {
  let filter = document.getElementById('filterKategori').value;
  let search = document.getElementById('searchInput').value.toLowerCase();
  let tabel = document.getElementById('tabelBarang');
  tabel.innerHTML = `<tr><th>No</th><th>Kategori</th><th>Nama Barang</th><th>Stok Sistem</th><th>Stok Fisik</th><th>Selisih</th><th>Aksi</th></tr>`;
  let total=0; let no = 1;
  dataBarang.forEach((item, i) => {
    if(filter!== 'ALL' && item.kategori!== filter) return;
    if(!item.nama.toLowerCase().includes(search)) return;
    total += Number(item.stokSistem) || 0;
    let fisikVal = item.stokFisik || '';
    let selisih = (Number(item.stokFisik) || 0) - (Number(item.stokSistem) || 0);
    tabel.innerHTML += `<tr><td>${item.no}</td><td><span class="badge badge-${item.kategori}">${item.kategori}</span></td><td style="text-align:left">${item.nama}</td><td><input type="number" value="${item.stokSistem}" onchange="updateSistem(${i}, this.value)"></td><td><input type="number" value="${fisikVal}" onchange="updateFisik(${i}, this.value)"></td><td>${selisih}</td><td><button class="btn-edit" onclick="editBarang(${i})">✏️</button> <button class="btn-hapus" onclick="hapus(${i})">🗑️</button></td></tr>`;
  });
  document.getElementById('totalStok').innerHTML = `📦 Total Item: ${dataBarang.length} | Total Stok Sistem: ${total}`;
  simpanData();
}

function simpanBarang() {
  let kategori = document.getElementById('kategoriBarang').value;
  let nama = document.getElementById('namaBarang').value.trim();
  let stok = parseInt(document.getElementById('stokSistem').value) || 0;
  let index = document.getElementById('editIndex').value;
  if(kategori && nama){
    if(index === ""){ dataBarang.push({kategori, nama, stokSistem: stok, stokFisik: 0});
    } else { dataBarang[index] = {kategori, nama, stokSistem: stok, stokFisik: dataBarang[index].stokFisik}; batalEdit(); }
    document.getElementById('kategoriBarang').value = ''; document.getElementById('namaBarang').value = ''; document.getElementById('stokSistem').value = '';
    tampilkan();
  } else { alert('Lengkapi Kategori dan Nama!'); }
}
function editBarang(i){ document.getElementById('editIndex').value = i; document.getElementById('kategoriBarang').value = dataBarang[i].kategori; document.getElementById('namaBarang').value = dataBarang[i].nama; document.getElementById('stokSistem').value = dataBarang[i].stokSistem; document.getElementById('judulForm').innerText = "Edit Barang"; document.getElementById('btnBatal').style.display = "block"; }
function batalEdit(){ document.getElementById('editIndex').value = ""; document.getElementById('judulForm').innerText = "Tambah Barang"; document.getElementById('btnBatal').style.display = "none"; }
function updateSistem(i, val){ dataBarang[i].stokSistem = parseInt(val) || 0; tampilkan(); }
function updateFisik(i, val){ dataBarang[i].stokFisik = parseInt(val) || 0; tampilkan(); }
function hapus(i){ if(confirm('Hapus barang ini?')){ dataBarang.splice(i,1); tampilkan(); }}

function simpanOpname(){
  let tgl = document.getElementById('tanggalOpname').value;
  if(!tgl){ alert('Pilih tanggal!'); return; }
  sessionStorage.setItem('riwayat_'+tgl, JSON.stringify(dataBarang));
  tampilkanDaftarRiwayat();
  alert('Data opname tanggal '+tgl+' sudah disimpan!');
}

function tampilkanDaftarRiwayat(){
  let keys = Object.keys(sessionStorage).filter(k => k.startsWith('riwayat_')).sort().reverse();
  let html = '';
  if(keys.length === 0){ html = '<p>Belum ada riwayat</p>'; }
  else {
    keys.forEach(k => {
      let tgl = k.replace('riwayat_','');
      html += `<button class="btn-riwayat" onclick="loadRiwayat('${tgl}')">📅 ${tgl} - Klik untuk buka</button>`;
    });
  }
  document.getElementById('listRiwayat').innerHTML = html;
}

function loadRiwayat(tgl){
  tanggalAktif = tgl;
  let data = JSON.parse(sessionStorage.getItem('riwayat_'+tgl));
  if(data){ dataBarang = data; document.getElementById('infoRiwayat').innerText = `Menampilkan data tanggal: ${tgl}`; document.getElementById('tanggalOpname').value = tgl; tampilkan();
  } else { alert('Data tanggal '+tgl+' tidak ada'); }
}

function hapusRiwayatTerpilih(){
  if(!tanggalAktif){ alert('Pilih riwayat dulu dengan klik tanggalnya'); return; }
  if(confirm('Hapus riwayat tanggal '+tanggalAktif+'?')){
    sessionStorage.removeItem('riwayat_'+tanggalAktif);
    tanggalAktif = "";
    tampilkanDaftarRiwayat();
    document.getElementById('infoRiwayat').innerText = '';
    alert('Riwayat dihapus');
  }
}

function exportExcel(){
  let csv = 'No,Kategori,Nama Barang,Stok Sistem,Stok Fisik,Selisih\n';
  dataBarang.forEach((item,i)=>{
    let selisih = (Number(item.stokFisik) || 0) - (Number(item.stokSistem) || 0);
    csv += `${item.no},${item.kategori},"${item.nama}",${item.stokSistem},${item.stokFisik || 0},${selisih}\n`;
  });
  let blob = new Blob([csv], {type: 'text/csv'});
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'SO-BENSPOT-'+document.getElementById('tanggalOpname').value+'.csv';
  a.click();
}

document.getElementById('tanggalOpname').valueAsDate = new Date();
loadData(); tampilkan(); tampilkanDaftarRiwayat();
</script>
</body>
</html>
