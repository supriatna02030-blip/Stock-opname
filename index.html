<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Opname RPC RAW ORI PRO</title>
<style>
  body{font-family:Arial; background:#3498db; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; padding:10px}
.login-box,.container{background:white; padding:25px; border-radius:10px; width:100%; max-width:1100px}
  h2{text-align:center; color:#2c3e50}
  input,button,select{width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:4px; box-sizing:border-box}
  button{background:#27ae60; color:white; border:none; cursor:pointer; font-weight:bold}
  button:hover{background:#229954}
.btn-edit{background:#f39c12; width:auto; padding:5px 10px; margin:2px}
.btn-hapus{background:red; width:auto; padding:5px 10px; margin:2px}
  table{width:100%; border-collapse:collapse; margin-top:15px; font-size:14px}
  th,td{border:1px solid #ddd; padding:8px; text-align:center}
  th{background:#3498db; color:white}
.badge{padding:3px 8px; border-radius:4px; color:white; font-size:12px}
.badge-RPC{background:#e67e22}.badge-RAW{background:#2980b9}.badge-ORI{background:#27ae60}
.selisih-plus{color:green; font-weight:bold}
.selisih-minus{color:red; font-weight:bold}
  #app{display:none}
.logout{float:right; background:red; width:auto; padding:5px 15px}
.filter{margin:10px 0; display:flex; gap:10px}
.total{margin-top:10px; font-weight:bold; background:#ecf0f1; padding:10px; border-radius:5px}
.meta {font-size:12px; color:gray; text-align:center; margin-top:8px}
.hidden{display:none}
.link-lupa{font-size:13px; text-align:center; margin-top:10px; color:#3498db; cursor:pointer; text-decoration:underline}
</style>
</head>
<body>

<!-- HALAMAN LOGIN MULTI USER -->
<div class="login-box" id="loginPage">
  <h2>LOGIN STOCK OPNAME PRO</h2>
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Masuk</button>
  <p class="meta">Hubungi Admin untuk akses login</p> <!-- UDAH DIHAPUS PASSWORDNYA -->
  <p class="link-lupa" onclick="lupaPassword()">Lupa Password?</p>
  <p id="loginError" class="meta" style="color:red; display:none">Username/Password salah!</p>
</div>

<!-- HALAMAN APLIKASI -->
<div class="container" id="app">
  <button class="logout" onclick="logout()">Logout</button>
  <h2>APLIKASI STOCK OPNAME RPC RAW ORI</h2>
  <p id="userInfo" style="text-align:center; font-weight:bold"></p>

  <h3 id="judulForm">1. Tambah Barang</h3>
  <div id="formTambah">
    <input type="hidden" id="editIndex" value="">
    <select id="kategoriBarang">
      <option value="">Pilih Kategori</option>
      <option value="RPC">RPC</option>
      <option value="RAW">RAW</option>
      <option value="ORI">ORI</option>
    </select>
    <input type="text" id="namaBarang" placeholder="Nama Barang">
    <input type="number" id="stokSistem" placeholder="Stok Sistem">
    <button onclick="simpanBarang()">+ Tambah / Update</button>
    <button id="btnBatal" onclick="batalEdit()" style="background:gray; display:none">Batal Edit</button>
  </div>

  <h3>2. Form Stock Opname</h3>
  <div class="filter">
    <input type="text" id="searchInput" onkeyup="tampilkan()" placeholder="🔍 Cari Nama Barang...">
    <select id="filterKategori" onchange="tampilkan()">
      <option value="ALL">Semua Kategori</option>
      <option value="RPC">RPC</option>
      <option value="RAW">RAW</option>
      <option value="ORI">ORI</option>
    </select>
  </div>
  <input type="date" id="tanggalOpname">
  <button onclick="simpanOpname()">Simpan Opname</button>
  <button onclick="exportExcel()">Export Excel</button>
  <button id="btnGantiPass" onclick="gantiPassword()" style="background:orange">Ganti Password</button>

  <table id="tabelBarang"></table>
  <div class="total" id="totalStok"></div>
</div>

<script>
// SIMPAN USER DI LOCALSTORAGE BIAR PASSWORD GA HILANG PAS DI GANTI
let users = JSON.parse(localStorage.getItem('users')) || {
  admin: {pass: "admin123", role: "admin"},
  staff: {pass: "staff123", role: "staff"},
  gudang: {pass: "gudang123", role: "viewer"}
};
let currentUser = null;
let dataBarang = JSON.parse(localStorage.getItem('dataBarang')) || [];

function simpanUsers(){
  localStorage.setItem('users', JSON.stringify(users));
}

function login(){
  let u = document.getElementById('username').value;
  let p = document.getElementById('password').value;
  if(users[u] && users[u].pass === p){
    currentUser = users[u];
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('userInfo').innerText = `Login sebagai: ${u.toUpperCase()} - Role: ${currentUser.role}`;
    cekRole();
    tampilkan();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}

function logout(){
  currentUser = null;
  document.getElementById('loginPage').style.display = 'block';
  document.getElementById('app').style.display = 'none';
}

function lupaPassword(){
  let waAdmin = "6285714450558"; // NOMOR BAPAK
  let pesan = encodeURIComponent("Halo Admin, saya lupa password Stock Opname. Tolong direset ya.");
  window.open(`https://wa.me/${waAdmin}?text=${pesan}`, '_blank');
  alert("Silakan hubungi Admin via WA 085714450558 untuk reset password");
}

function cekRole(){
  if(currentUser.role!== 'admin'){
    document.getElementById('formTambah').classList.add('hidden');
    document.getElementById('btnGantiPass').classList.add('hidden');
  }
}

function tampilkan() {
  let filter = document.getElementById('filterKategori').value;
  let search = document.getElementById('searchInput').value.toLowerCase();
  let tabel = document.getElementById('tabelBarang');
  tabel.innerHTML = `<tr><th>No</th><th>Kategori</th><th>Nama Barang</th><th>Stok Sistem</th><th>Stok Fisik</th><th>Selisih</th><th id="thAksi">Aksi</th></tr>`;

  let totalRPC=0, totalRAW=0, totalORI=0, totalJumlah=0;
  let no = 1;
  dataBarang.forEach((item, i) => {
    if(filter!== 'ALL' && item.kategori!== filter) return;
    if(!item.nama.toLowerCase().includes(search)) return; // FITUR CARI

    if(item.kategori==="RPC") totalRPC += Number(item.stokSistem) || 0;
    if(item.kategori==="RAW") totalRAW += Number(item.stokSistem) || 0;
    if(item.kategori==="ORI") totalORI += Number(item.stokSistem) || 0;
    totalJumlah += Number(item.stokSistem) || 0;

    let fisikVal = (item.stokFisik!== undefined)? item.stokFisik : '';
    let selisih = (Number(item.stokFisik) || 0) - (Number(item.stokSistem) || 0);
    let classSelisih = selisih > 0? 'selisih-plus' : selisih < 0? 'selisih-minus' : '';
    let btnAksi = currentUser.role === 'admin'? `<button class="btn-edit" onclick="editBarang(${i})">Edit</button> <button class="btn-hapus" onclick="hapus(${i})">Hapus</button>` : '';

    tabel.innerHTML += `<tr>
      <td>${no++}</td>
      <td><span class="badge badge-${item.kategori}">${item.kategori}</span></td>
      <td>${item.nama}</td>
      <td>${item.stokSistem}</td>
      <td><input type="number" value="${fisikVal}" onchange="updateFisik(${i}, this.value)"></td>
      <td class="${classSelisih}">${selisih}</td>
      <td>${btnAksi}</td>
    </tr>`;
  });
  if(currentUser.role!== 'admin') document.getElementById('thAksi').classList.add('hidden');

  document.getElementById('totalStok').innerHTML =
    `Total Item: ${totalJumlah} | RPC: ${totalRPC} | RAW: ${totalRAW} | ORI: ${totalORI}`;
  localStorage.setItem('dataBarang', JSON.stringify(dataBarang));
}

function simpanBarang() {
  if(currentUser.role === 'viewer') return alert('Anda tidak punya akses!');
  let kategori = document.getElementById('kategoriBarang').value;
  let nama = document.getElementById('namaBarang').value.trim();
  let stok = parseInt(document.getElementById('stokSistem').value);
  let index = document.getElementById('editIndex').value;

  if(kategori && nama &&!isNaN(stok)){
    if(index === ""){
      dataBarang.push({kategori, nama, stokSistem: stok, stokFisik: 0});
    } else {
      dataBarang[index].kategori = kategori;
      dataBarang[index].nama = nama;
      dataBarang[index].stokSistem = stok;
      batalEdit();
    }
    kosongkanForm();
    tampilkan();
  } else { alert('Lengkapi Kategori, Nama, dan Stok!'); }
}

function editBarang(i){
  if(currentUser.role!== 'admin') return alert('Hanya Admin!');
  document.getElementById('editIndex').value = i;
  document.getElementById('kategoriBarang').value = dataBarang[i].kategori;
  document.getElementById('namaBarang').value = dataBarang[i].nama;
  document.getElementById('stokSistem').value = dataBarang[i].stokSistem;
  document.getElementById('judulForm').innerText = "1. Edit Barang";
  document.getElementById('btnBatal').style.display = "block";
  window.scrollTo(0,0);
}

function batalEdit(){ document.getElementById('editIndex').value = ""; document.getElementById('judulForm').innerText = "1. Tambah Barang"; document.getElementById('btnBatal').style.display = "none"; kosongkanForm(); }
function kosongkanForm(){ document.getElementById('kategoriBarang').value = ''; document.getElementById('namaBarang').value = ''; document.getElementById('stokSistem').value = ''; }
function updateFisik(i, val){ let num = parseInt(val) || 0; dataBarang[i].stokFisik = num; tampilkan(); }
function hapus(i){ if(currentUser.role!== 'admin') return alert('Hanya Admin!'); if(confirm('Hapus barang ini?')){ dataBarang.splice(i,1); tampilkan(); } }
function simpanOpname(){ let tgl = document.getElementById('tanggalOpname').value; if(!tgl){ alert('Pilih tanggal!'); return; } localStorage.setItem('riwayat_'+tgl, JSON.stringify(dataBarang)); alert('Data opname tanggal '+tgl+' sudah disimpan!'); }
function exportExcel(){ let csv = 'No,Kategori,Nama Barang,Stok Sistem,Stok Fisik,Selisih\n'; dataBarang.forEach((item,i)=>{ let selisih = (Number(item.stokFisik) || 0) - (Number(item.stokSistem) || 0); csv += `${i+1},${item.kategori},"${item.nama}",${item.stokSistem},${item.stokFisik || 0},${selisih}\n`; }); let blob = new Blob([csv], {type: 'text/csv'}); let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'stock-opname.csv'; a.click(); }

function gantiPassword(){
  if(currentUser.role!== 'admin') return;
  let u = prompt('Ganti password user: admin/staff/gudang');
  if(users[u]){
    let baru = prompt('Password Baru:');
    users[u].pass = baru;
    simpanUsers(); // SIMPAN BIAR PERMANEN
    alert('Password '+u+' diganti jadi: '+baru);
  }
}

document.getElementById('tanggalOpname').valueAsDate = new Date();
</script>
</body>
</html>
