<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Stock Opname</title>
<style>
    body { font-family: Arial; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 90%; max-width: 400px; }
    .login-box h2 { text-align: center; margin-bottom: 20px; }
    input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
    button:hover { background: #218838; }
    .error { color: red; text-align: center; margin-top: 10px; display: none; }
    #app { display: none; }
</style>
</head>
<body>

<div class="login-box" id="loginPage">
    <h2>LOGIN STOCK OPNAME</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Masuk</button>
    <p class="error" id="errorMsg">Username atau Password salah!</p>
</div>

<div id="app">
    <h1 style="text-align:center">APLIKASI STOCK OPNAME RPC RAW ORI</h1>
    <h3>1. Tambah Barang</h3>
    <select id="kategori"><option>RPC</option><option>RAW</option><option>ORI</option></select><br><br>
    <input type="text" id="namaBarang" placeholder="Nama Barang"><br><br>
    <input type="number" id="stokSistem" placeholder="Stok Sistem"><br><br>
    <button onclick="alert('Data disimpan!')">+ Tambah / Update</button>
    
    <h3>2. Form Stock Opname</h3>
    <label>Filter Kategori:</label>
    <select><option>Semua Kategori</option></select><br><br>
    <input type="date" value="2026-08-07"><br><br>
    <button>Lihat Data</button><br><br>
    <button>Export Excel</button><br><br>
    <button onclick="logout()" style="background:red">Logout</button>
</div>

<script>
function login(){
    let user = document.getElementById('username').value;
    let pass = document.getElementById('password').value;
    if(user === 'admin' && pass === '123'){
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('app').style.display = 'block';
    } else {
        document.getElementById('errorMsg').style.display = 'block';
    }
}
function logout(){
    document.getElementById('loginPage').style.display = 'block';
    document.getElementById('app').style.display = 'none';
}
</script>

</body>
</html>
