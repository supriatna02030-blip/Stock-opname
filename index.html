<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Opname PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{font-family:'Poppins', sans-serif}
  body{
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; padding:15px
  }
 .login-box,.container{
    background:white; padding:30px; border-radius:20px; width:100%; max-width:1100px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    animation: fadeIn 0.5s ease-in
  }
  @keyframes fadeIn {from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:translateY(0)}}
  h2{text-align:center; color:#667eea; font-weight:700}
  input,button,select{
    width:100%; padding:12px; margin:8px 0; border:2px solid #eee; border-radius:10px; 
    box-sizing:border-box; font-size:14px; transition:0.3s
  }
  input:focus, select:focus{border-color:#667eea; outline:none}
  button{
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color:white; border:none; cursor:pointer; font-weight:600; border-radius:10px
  }
  button:hover{transform: translateY(-2px); box-shadow:0 5px 15px rgba(102,126,234,0.4)}
 .btn-edit{background: linear-gradient(135deg, #f39c12, #e67e22)}
 .btn-hapus{background: linear-gradient(135deg, #e74c3c, #c0392b)}
 .logout{background: linear-gradient(135deg, #e74c3c, #c0392b)}
  table{width:100%; border-collapse:separate; border-spacing:0 8px; margin-top:15px; font-size:14px}
  th,td{padding:12px; text-align:center}
  th{background:#667eea; color:white; border-radius:10px}
  tr{background:#f8f9fa; border-radius:10px}
 .badge{padding:5px 12px; border-radius:20px; color:white; font-size:12px; font-weight:600}
 .badge-RPC{background:#e67e22}.badge-RAW{background:#3498db}.badge-ORI{background:#2ecc71}
 .selisih-plus{color:#2ecc71; font-weight:bold}
 .selisih-minus{color:#e74c3c; font-weight:bold}
  #app{display:none}
 .filter{margin:10px 0; display:flex; gap:10px}
 .total{margin-top:15px; font-weight:700; background:linear-gradient(135deg, #667eea, #764ba2); color:white; padding:15px; border-radius:15px; text-align:center}
 .meta {font-size:12px; color:gray; text-align:center; margin-top:8px}
 .hidden{display:none}
 .link-lupa{font-size:13px; text-align:center; margin-top:10px; color:#667eea; cursor:pointer; text-decoration:underline; font-weight:600}
 .card-title{display:flex; align-items:center; gap:10px; margin-bottom:15px}
 .card-title::before{content:"📦"; font-size:20px}
</style>
</head>
<body>

<!-- HALAMAN LOGIN -->
<div class="login-box" id="loginPage">
  <h2>🔐 LOGIN STOCK OPNAME PRO</h2>
  <input type="text" id="username" placeholder="👤 Username">
  <input type="password" id="password" placeholder="🔑 Password">
  <button onclick="login()">Masuk Sekarang</button>
  <p class="meta">Hubungi Admin untuk akses login</p>
  <p class="link-lupa" onclick="lupaPassword()">Lupa Password?</p>
  <p id="loginError" class="meta" style="color:red; display:none">Username/Password salah!</p>
</div>

<!-- HALAMAN APLIKASI -->
<div class="container" id="app">
  <button class="logout" onclick="logout()">🚪 Logout</button>
  <h2>📊 APLIKASI STOCK OPNAME RPC RAW ORI</h2>
  <p id="userInfo" style="text-align:center; font-weight:600; color:#667eea"></p>

  <div class="card-title"><h3 id="judulForm">Tambah Barang</h3></div>
  <div id="formTambah">
    <input type="hidden" id="editIndex" value="">
    <select id="kategoriBarang">
      <option value="">📁 Pilih Kategori</option>
      <option value="RPC">RPC</option>
      <option value="RAW">RAW</option>
      <option value="ORI">ORI</option>
    </select>
    <input type="text" id="namaBarang" placeholder="📦 Nama Barang">
    <input type="number" id="stokSistem" placeholder="📈 Stok Sistem">
    <button onclick="simpanBarang()">+ Tambah / Update</button>
    <button id="btnBatal" onclick="batalEdit()" style="background:gray; display:none">Batal Edit</button>
  </div>

  <div class="card-title"><h3>Form Stock Opname</h3></div>
  <div class="filter">
    <input type="text" id="searchInput" onkeyup="tampilkan()" placeholder="🔍 Cari Nama Barang...">
    <select id="filterKategori" onchange="tampilkan()">
      <option value="ALL">Semua Kategori</option>
      <option value="RPC">RPC</option>
      <option value="RAW">RAW</option>
      <option value="ORI">ORI</option>
    </select>
  </div>
  <input type="date" id="tanggalOpname">
  <button onclick="simpanOpname()">💾 Simpan Opname</button>
  <button onclick="exportExcel()">📤 Export Excel</button>
  <button id="btnGantiPass" onclick="gantiPassword()" style="background:linear-gradient(135deg, #f39c12, #e67e22)">🔑 Ganti Password</button>

  <table id="tabelBarang"></table>
  <div class="total" id="totalStok"></div>
</div>

<script>
let users = JSON.parse(localStorage.getItem('users')) || {
  admin: {pass: "admin123", role: "admin"},
  staff: {pass: "staff123", role: "staff"},
  gudang: {pass: "gudang123", role: "viewer"}
};
let currentUser = null;
let dataBarang = JSON.parse(localStorage.getItem('dataBarang')) || [];

function simpanUsers(){ localStorage.setItem('users', JSON.stringify(users)); }
function login(){
  let u = document.getElementById('username').value;
  let p = document.getElementById('password').value;
  if(users[u] && users[u].pass === p){
    currentUser = users[u];
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('userInfo').innerText = `Login sebagai: ${u.toUpperCase()} - Role: ${currentUser.role}`;
    cekRole();
    tampilkan();
  } else { document.getElementById('loginError').style.display = 'block'; }
}
function logout(){ currentUser = null; document.getElementById('loginPage').style.display = 'block'; document.getElementById('app').style.display = 'none'; }
function lupaPassword(){ window.open(`https://wa.me/6285714450558?text=Halo Admin, saya lupa password Stock Opname. Tolong direset ya.`, '_blank'); alert("Silakan hubungi Admin via WA 085714450558"); }
function cekRole(){ if(currentUser.role!== 'admin'){ document.getElementById('formTambah').classList.add('hidden'); document.getElementById('btnGantiPass').classList.add('hidden'); }
function tampilkan() {
  let filter = document.getElementById('filterKategori').value;
  let search = document.getElementById('searchInput').value.toLowerCase();
  let tabel = document.getElementById('tabelBarang');
  tabel.innerHTML = `<tr><th>No</th><th>Kategori</th><th>Nama Barang</th><th>Stok Sistem</th><th>Stok Fisik</th><th>Selisih</th><th id="thAksi">Aksi</th></tr>`;
  let totalRPC=0, totalRAW=0, totalORI=0, totalJumlah=0; let no = 1;
  dataBarang.forEach((item, i) => {
    if(filter!== 'ALL' && item.kategori!== filter) return;
    if(!item.nama.toLowerCase().includes(search)) return;
    if(item.kategori==="RPC") totalRPC += Number(item.stokSistem) || 0;
    if(item.kategori==="RAW") totalRAW += Number(item.stokSistem) || 0;
    if(item.kategori==="ORI") totalORI += Number(item.stokSistem) || 0;
    totalJumlah += Number(item.stokSistem) || 0;
    let fisikVal = (item.stokFisik!== undefined)? item.stokFisik : '';
    let selisih = (Number(item.stokFisik) || 0) - (Number(item.stokSistem) || 0);
    let classSelisih = selisih > 0? 'selisih-plus' : selisih < 0? 'selisih-minus' : '';
    let btnAksi = currentUser.role === 'admin'? `<button class="btn-edit" onclick="editBarang(${i})">✏️</button> <button class="btn-hapus" onclick="hapus(${i})">🗑️</button>` : '';
    tabel.innerHTML += `<tr>
      <td>${no++}</td>
      <td><span class="badge badge-${item.kategori}">${item.kategori}</span></td>
      <td>${item.nama}</td>
      <td>${item.stokSistem}</td>
      <td><input type="number" value="${fisikVal}" onchange="updateFisik(${i}, this.value)"></td>
      <td class="${classSelisih}">${selisih}</td>
      <td>${btnAksi}</td>
    </tr>`;
  });
  if(currentUser.role!== 'admin') document.getElementById('thAksi').classList.add('hidden');
  document.getElementById('totalStok').innerHTML =
    `📦 Total Item: ${totalJumlah} | 🟠 RPC: ${totalRPC} | 🔵 RAW: ${totalRAW} | 🟢 ORI: ${totalORI}`;
  localStorage.setItem('dataBarang', JSON.stringify(dataBarang));
}
function simpanBarang() {
  if(currentUser.role === 'viewer') return alert('Anda tidak punya akses!');
  let kategori = document.getElementById('kategoriBarang').value;
  let nama = document.getElementById('namaBarang').value.trim();
  let stok = parseInt(document.getElementById('stokSistem').value);
  let index = document.getElementById('editIndex').value;
  if(kategori && nama &&!isNaN(stok)){
    if(index === ""){ dataBarang.push({kategori, nama, stokSistem: stok, stokFisik: 0});
    } else { dataBarang[index].kategori = kategori; dataBarang[index].nama = nama; dataBarang[index].stokSistem = stok; batalEdit(); }
    kosongkanForm(); tampilkan();
  } else { alert('Lengkapi Kategori, Nama, dan Stok!'); }
}
function editBarang(i){ if(currentUser.role!== 'admin') return alert('Hanya Admin!'); document.getElementById('editIndex').value = i; document.getElementById('kategoriBarang').value = dataBarang[i].kategori; document.getElementById('namaBarang').value = dataBarang[i].nama; document.getElementById('stokSistem').value = dataBarang[i].stokSistem; document.getElementById('judulForm').innerText = "Edit Barang"; document.getElementById('btnBatal').style.display = "block"; window.scrollTo(0,0); }
function batalEdit(){ document.getElementById('editIndex').value = ""; document.getElementById('judulForm').innerText = "Tambah Barang"; document.getElementById('btnBatal').style.display = "none"; kosongkanForm(); }
function kosongkanForm(){ document.getElementById('kategoriBarang').value = ''; document.getElementById('namaBarang').value = ''; document.getElementById('stokSistem').value = ''; }
function updateFisik(i, val){ let num = parseInt(val) || 0; dataBarang[i].stokFisik = num; tampilkan(); }
function hapus(i){ if(currentUser.role!== 'admin') return alert('Hanya Admin!'); if(confirm('Hapus barang ini?')){ dataBarang.splice(i,1); tampilkan(); } }
function simpanOpname(){ let tgl = document.getElementById('tanggalOpname').value; if(!tgl){ alert('Pilih tanggal!'); return; } localStorage.setItem('riwayat_'+tgl, JSON.stringify(dataBarang)); alert('Data opname tanggal '+tgl+' sudah disimpan!'); }
function exportExcel(){ let csv = 'No,Kategori,Nama Barang,Stok Sistem,Stok Fisik,Selisih\n'; dataBarang.forEach((item,i)=>{ let selisih = (Number(item.stokFisik) || 0) - (Number(item.stokSistem) || 0); csv += `${i+1},${item.kategori},"${item.nama}",${item.stokSistem},${item.stokFisik || 0},${selisih}\n`; }); let blob = new Blob([csv], {type: 'text/csv'}); let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'stock-opname.csv'; a.click(); }
function gantiPassword(){ if(currentUser.role!== 'admin') return; let u = prompt('Ganti password user: admin/staff/gudang'); if(users[u]){ let baru = prompt('Password Baru:'); users[u].pass = baru; simpanUsers(); alert('Password '+u+' diganti jadi: '+baru); } }
document.getElementById('tanggalOpname').valueAsDate = new Date();
</script>
</body>
</html>
