<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Opname Benspot</title>
<style>
  body{font-family:Arial; padding:10px; background:#f5f5f5}
  .btn{padding:10px 15px; border:none; border-radius:8px; cursor:pointer; margin:5px}
  .btn-hijau{background:#22c55e; color:white}
  .btn-biru{background:#3b82f6; color:white}
  table{width:100%; border-collapse:collapse; background:white}
  th,td{border:1px solid #ddd; padding:8px; text-align:center}
  th{background:#eee}
  #listRiwayat button{width:100%; text-align:left; padding:8px; margin:3px 0; background:#fff; border:1px solid #ccc; border-radius:5px}
</style>
</head>
<body>

<h2>Stock Opname Benspot</h2>
<button class="btn btn-hijau" onclick="loadTemplate()">Load Template Benspot</button>
<input type="date" id="tanggal">
<button class="btn btn-biru" onclick="simpanOpname()">Simpan Opname</button>
<button class="btn btn-biru" onclick="exportExcel()">Export Excel</button>

<table id="tabelBarang">
<thead>
<tr><th>Kategori</th><th>Nama Barang</th><th>Stok Sistem</th><th>Stok Fisik</th><th>Selisih</th></tr>
</thead>
<tbody></tbody>
</table>

<h3>Riwayat Opname</h3>
<div id="listRiwayat"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const templateBenspot = [
  {kat:"RPC", nama:"RPC Monin Strawberry", sistem:0, fisik:0},
  {kat:"RPC", nama:"RPC Monin Mango", sistem:0, fisik:0},
  // ... LANJUTIN SAMPAI 57 ITEM OM ...
  {kat:"RAW", nama:"RAW Choco Hazelnut", sistem:0, fisik:0}
];

function loadTemplate(){
  let tbody = document.querySelector("#tabelBarang tbody");
  tbody.innerHTML = "";
  templateBenspot.forEach((item, i)=>{
    tbody.innerHTML += `<tr>
      <td>${item.kat}</td>
      <td>${item.nama}</td>
      <td><input type="number" value="${item.sistem}" id="sistem${i}"></td>
      <td><input type="number" value="${item.fisik}" id="fisik${i}"></td>
      <td id="selisih${i}">0</td>
    </tr>`;
  });
}

function simpanOpname(){
  let tanggal = document.getElementById("tanggal").value;
  if(!tanggal) return alert("Pilih tanggal dulu!");
  
  let data = [];
  templateBenspot.forEach((item, i)=>{
    let sistem = parseInt(document.getElementById("sistem"+i).value) || 0;
    let fisik = parseInt(document.getElementById("fisik"+i).value) || 0;
    let selisih = fisik - sistem;
    document.getElementById("selisih"+i).innerText = selisih;
    data.push({...item, sistem, fisik, selisih});
  });

  simpanKeRiwayat(tanggal, data);
  tampilkanRiwayat();
  alert("Data tanggal "+tanggal+" berhasil disimpan!");
}

function simpanKeRiwayat(tanggal, data) {
  let riwayat = JSON.parse(localStorage.getItem('riwayatBenspot')) || [];
  riwayat = riwayat.filter(item => item.tanggal !== tanggal);
  riwayat.push({ tanggal: tanggal, data: data, waktu: new Date().toLocaleString() });
  riwayat.sort((a,b) => new Date(b.tanggal) - new Date(a.tanggal));
  localStorage.setItem('riwayatBenspot', JSON.stringify(riwayat));
}

function tampilkanRiwayat() {
  let riwayat = JSON.parse(localStorage.getItem('riwayatBenspot')) || [];
  let html = '';
  if(riwayat.length === 0) {
    html = '<p>Belum ada riwayat</p>';
  } else {
    riwayat.forEach(item => {
      html += `<button onclick="loadRiwayat('${item.tanggal}')">
                📅 ${item.tanggal} - ${item.waktu}
               </button>`;
    });
  }
  document.getElementById('listRiwayat').innerHTML = html;
}

function loadRiwayat(tanggal){
  let riwayat = JSON.parse(localStorage.getItem('riwayatBenspot')) || [];
  let item = riwayat.find(r => r.tanggal === tanggal);
  if(!item) return;
  document.getElementById("tanggal").value = tanggal;
  let tbody = document.querySelector("#tabelBarang tbody");
  tbody.innerHTML = "";
  item.data.forEach((d, i)=>{
    tbody.innerHTML += `<tr>
      <td>${d.kat}</td>
      <td>${d.nama}</td>
      <td><input type="number" value="${d.sistem}" id="sistem${i}"></td>
      <td><input type="number" value="${d.fisik}" id="fisik${i}"></td>
      <td id="selisih${i}">${d.selisih}</td>
    </tr>`;
  });
}

function exportExcel(){
  let wb = XLSX.utils.table_to_book(document.getElementById('tabelBarang'));
  XLSX.writeFile(wb, `SO-BENSPOT-${document.getElementById("tanggal").value}.xlsx`);
}

window.onload = tampilkanRiwayat;
</script>
</body>
</html>
