<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STOCK OPNAME PRO MAX</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  *{font-family:'Poppins', sans-serif}
  body{background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; padding:15px;}
  .container{background:white; padding:25px; border-radius:20px; width:100%; max-width:600px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);}
  h2,h3{text-align:center; color:#667eea; font-weight:700}
  input,button,select{width:100%; padding:12px; margin:8px 0; border:2px solid #eee; border-radius:12px; box-sizing:border-box; font-size:14px; background:#f8f9fa}
  button{background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color:white; border:none; cursor:pointer; font-weight:600; border-radius:12px}
  .btn-green{background: #1abc9c} .btn-purple{background: #9b59b6} .btn-logout{background:#95a5a6; width:auto; padding:8px 15px; position:absolute; top:25px; right:25px}
  .btn-edit{background: #f39c12; width:auto; padding:5px 12px; margin:2px} .btn-hapus{background: #e74c3c; width:auto; padding:5px 12px; margin:2px}
  .hidden{display:none} .header{position:relative}
  .info-login{text-align:center; color:#667eea; font-weight:600; margin-bottom:15px}
  table{width:100%; border-collapse:collapse; margin-top:15px} th,td{padding:10px; border-bottom:1px solid #eee; text-align:center; font-size:12px}
</style>
</head>
<body>

<div class="container" id="loginPage">
  <h2>📊 STOCK OPNAME PRO MAX</h2>
  <input type="email" id="email" placeholder="📧 Email">
  <input type="password" id="password" placeholder="🔑 Password">
  <select id="role"><option value="staff">Staff</option><option value="admin">Admin</option><option value="viewer">Viewer</option></select>
  <button onclick="register()">Daftar Akun Baru</button>
  <button onclick="login()">Masuk</button>
  <p id="loginError" style="color:red; text-align:center"></p>
</div>

<div class="container hidden" id="app">
  <div class="header">
    <h2>📊 STOCK OPNAME PRO MAX</h2>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>
  <p class="info-login" id="userInfo"></p>

  <h3><b>Tambah Barang</b></h3>
  <input type="hidden" id="editId">
  <select id="kategoriBarang"><option value="">📁 Pilih Kategori</option><option value="RPC">RPC</option><option value="RAW">RAW</option><option value="ORI">ORI</option></select>
  <input type="text" id="namaBarang" placeholder="📦 Nama Barang">
  <input type="number" id="stokSistem" placeholder="📈 Stok Sistem">
  <button onclick="simpanBarang()">+ Tambah / Update</button>
  <button id="btnBatal" onclick="batalEdit()" style="background:gray; display:none">Batal Edit</button>

  <h3><b>Form Stock Opname</b></h3>
  <div style="display:flex; gap:10px"><input type="text" id="searchInput" onkeyup="tampilkan()" placeholder="🔍 Cari Nama Barang" style="flex:2"><select id="filterKategori" onchange="tampilkan()" style="flex:1"><option value="ALL">Semua</option><option value="RPC">RPC</option><option value="RAW">RAW</option><option value="ORI">ORI</option></select></div>
  <input type="date" id="tanggalOpname">
  <button class="btn-green" onclick="simpanOpname()">💾 Simpan Opname</button>
  <div style="display:flex; gap:10px"><button class="btn-green" onclick="exportExcel()">📦 Export Excel</button> <button class="btn-green" onclick="window.print()">🖨️ Print PDF</button></div>
  <button class="btn-purple" onclick="gantiPassword()">🔑 Ganti Password</button>

  <h3><b>📜 Riwayat Opname</b></h3>
  <div style="display:flex; gap:10px"><input type="date" id="tanggalRiwayat" style="flex:2"><button class="btn-green" onclick="loadRiwayat()" style="flex:1">📁 Lihat</button><button class="btn-purple" onclick="hapusRiwayat()" style="flex:1">Hapus</button></div>
  <div id="infoRiwayat"></div>
  <table id="tabelBarang"></table>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC-_iqLOETBc0CA_i-nQXqiZnFAbbVy_aE",
  authDomain: "stock-opname-om.firebaseapp.com",
  projectId: "stock-opname-om",
  storageBucket: "stock-opname-om.firebasestorage.app",
  messagingSenderId: "419566416384",
  appId: "1:419566416384:web:ab8089e297e29888e65ee5"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
let currentUser = null;
let dataBarang = [];

function register(){ let email = document.getElementById('email').value; let pass = document.getElementById('password').value; let role = document.getElementById('role').value; auth.createUserWithEmailAndPassword(email, pass).then(res => { db.collection('users').doc(res.user.uid).set({email, role}); alert('Daftar berhasil! Silakan Login'); }).catch(e => alert(e.message)); }
function login(){ let email = document.getElementById('email').value; let pass = document.getElementById('password').value; auth.signInWithEmailAndPassword(email, pass).then(res => { db.collection('users').doc(res.user.uid).get().then(doc => { currentUser = {uid: res.user.uid, ...doc.data()}; document.getElementById('loginPage').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); document.getElementById('userInfo').innerText = `Login sebagai: ${currentUser.email} - Role: ${currentUser.role}`; document.getElementById('tanggalOpname').valueAsDate = new Date(); document.getElementById('tanggalRiwayat').valueAsDate = new Date(); loadBarang(); }) }).catch(e => document.getElementById('loginError').innerText = e.message); }
function logout(){ auth.signOut(); location.reload(); }
function loadBarang(){ db.collection('barang').where('uid','==',currentUser.uid).onSnapshot(snap => { dataBarang = []; snap.forEach(doc => dataBarang.push({id:doc.id, ...doc.data()})); tampilkan(); }); }
function simpanBarang(){ let data = { kategori: document.getElementById('kategoriBarang').value, nama: document.getElementById('namaBarang').value, stokSistem: Number(document.getElementById('stokSistem').value), stokFisik: 0, uid: currentUser.uid }; let id = document.getElementById('editId').value; if(id) db.collection('barang').doc(id).update(data); else db.collection('barang').add(data); batalEdit(); }
function editBarang(id){ let b = dataBarang.find(x=>x.id===id); document.getElementById('editId').value = id; document.getElementById('kategoriBarang').value = b.kategori; document.getElementById('namaBarang').value = b.nama; document.getElementById('stokSistem').value = b.stokSistem; document.getElementById('btnBatal').style.display = "block"; }
function batalEdit(){ document.getElementById('editId').value = ""; document.getElementById('formTambah').querySelectorAll('input,select').forEach(i=>i.value=""); document.getElementById('btnBatal').style.display = "none"; }
function hapusBarang(id){ if(confirm('Hapus barang ini?')) db.collection('barang').doc(id).delete(); }
function tampilkan(){ let search = document.getElementById('searchInput').value.toLowerCase(); let filter = document.getElementById('filterKategori').value; let filtered = dataBarang.filter(b => (b.nama.toLowerCase().includes(search)) && (filter === 'ALL' || b.kategori === filter)); let html = `<tr><th>No</th><th>Kategori</th><th>Nama</th><th>Sistem</th><th>Fisik</th><th>Aksi</th></tr>`; filtered.forEach((b,i)=>{ html += `<tr><td>${i+1}</td><td>${b.kategori}</td><td>${b.nama}</td><td>${b.stokSistem}</td><td><input type="number" value="${b.stokFisik}" onblur="updateFisik('${b.id}',this.value)" style="width:60px"></td><td><button class="btn-edit" onclick="editBarang('${b.id}')">Edit</button><button class="btn-hapus" onclick="hapusBarang('${b.id}')">Hapus</button></td></tr>` }) document.getElementById('tabelBarang').innerHTML = html; }
function updateFisik(id,val){ db.collection('barang').doc(id).update({stokFisik:Number(val)}) }
function simpanOpname(){ let tgl = document.getElementById('tanggalOpname').value; db.collection('riwayat').add({tgl, data: dataBarang, uid: currentUser.uid}); alert('Opname tanggal '+tgl+' tersimpan!'); }
function loadRiwayat(){ let tgl = document.getElementById('tanggalRiwayat').value; db.collection('riwayat').where('tgl','==',tgl).where('uid','==',currentUser.uid).get().then(snap=>{ if(snap.empty) return document.getElementById('infoRiwayat').innerText = 'Data tidak ada'; snap.forEach(doc=>{ let d = doc.data(); document.getElementById('infoRiwayat').innerText = `Riwayat tanggal ${d.tgl} - ${d.data.length} barang`; }) }) }
function hapusRiwayat(){ alert('Fitur hapus riwayat') }
function exportExcel(){ let ws = XLSX.utils.json_to_sheet(dataBarang); let wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Stock"); XLSX.writeFile(wb, "StockOpname.xlsx"); }
function gantiPassword(){ auth.sendPasswordResetEmail(currentUser.email); alert('Link ganti password dikirim ke email') }
</script>
</body>
</html>
