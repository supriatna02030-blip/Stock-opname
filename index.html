<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Opname ULTIMATE</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
  :root{ --bg1:#667eea; --bg2:#764ba2; --card:white; --text:#333; --border:#eee; }
  body.dark{ --bg1:#1a1a2e; --bg2:#16213e; --card:#0f3460; --text:#e0e0e0; --border:#333; }
  *{font-family:'Poppins', sans-serif}
  body{background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%); display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; padding:15px; color:var(--text); transition:0.3s}
.container{background:var(--card); padding:30px; border-radius:20px; width:100%; max-width:1100px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); transition:0.3s}
  h2{text-align:center; color:var(--text); font-weight:700}
  input,button,select{width:100%; padding:12px; margin:8px 0; border:2px solid var(--border); border-radius:10px; box-sizing:border-box; font-size:14px; background:var(--card); color:var(--text)}
  button{background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%); color:white; border:none; cursor:pointer; font-weight:600; border-radius:10px}
.btn-reset{background:#e74c3c} .btn-lupa{background:#f39c12} .btn-dark{position:absolute; top:20px; right:20px; width:auto; padding:8px 15px; background:#34495e}
.btn-edit{background: #f39c12; width:auto; padding:5px 12px; margin:2px} .btn-hapus{background: #e74c3c; width:auto; padding:5px 12px; margin:2px}
.btn-logout{background:#95a5a6; width:auto; padding:8px 15px} .btn-aksi{background:#1abc9c; width:auto; padding:8px 15px; margin:5px}
.hidden{display:none} .filter{display:flex; gap:10px} .total{margin-top:15px; font-weight:700; background:linear-gradient(135deg, var(--bg1), var(--bg2)); color:white; padding:15px; border-radius:15px; text-align:center}
  table{width:100%; border-collapse:collapse; margin-top:15px} th,td{padding:12px; text-align:center; border-bottom:1px solid var(--border)} th{background:var(--bg1); color:white}
.badge{padding:5px 12px; border-radius:20px; color:white; font-size:12px; font-weight:600} .badge-RPC{background:#e67e22}.badge-RAW{background:#3498db}.badge-ORI{background:#2ecc71}
.header{display:flex; justify-content:space-between; align-items:center; position:relative}
#reader{width:100%; margin-top:10px}
</style>
</head>
<body>
<button class="btn-dark" onclick="toggleDark()">🌙 Dark</button>

<div class="container" id="loginPage">
  <h2>🔐 LOGIN ULTIMATE</h2>
  <input type="email" id="email" placeholder="📧 Email">
  <input type="password" id="password" placeholder="🔑 Password">
  <select id="role"><option value="staff">Staff</option><option value="admin">Admin</option><option value="viewer">Viewer</option></select>
  <button onclick="register()">Daftar Akun Baru</button>
  <button onclick="login()">Masuk</button>
  <p id="loginError" style="color:red"></p>
</div>

<div class="container hidden" id="app">
  <div class="header">
    <h2>📊 STOCK OPNAME ULTIMATE</h2>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>
  <p id="userInfo" style="text-align:center; font-weight:600;"></p>

  <h3 id="judulForm">Tambah Barang</h3>
  <div id="formTambah">
    <input type="hidden" id="editId" value="">
    <select id="kategoriBarang"><option value="">📁 Pilih Kategori</option><option value="RPC">RPC</option><option value="RAW">RAW</option><option value="ORI">ORI</option></select>
    <input type="text" id="kodeBarang" placeholder="📷 Scan / Isi Kode Barcode">
    <button onclick="startScanner()">📷 Scan Barcode</button>
    <div id="reader" class="hidden"></div>
    <input type="text" id="namaBarang" placeholder="📦 Nama Barang">
    <input type="number" id="stokSistem" placeholder="📈 Stok Sistem">
    <button onclick="simpanBarang()">+ Tambah / Update</button>
    <button id="btnBatal" onclick="batalEdit()" style="background:gray; display:none">Batal Edit</button>
  </div>

  <h3>Form Stock Opname</h3>
  <div class="filter"><input type="text" id="searchInput" onkeyup="tampilkan()" placeholder="🔍 Cari..."><select id="filterKategori" onchange="tampilkan()"><option value="ALL">Semua</option><option value="RPC">RPC</option><option value="RAW">RAW</option><option value="ORI">ORI</option></select></div>
  <input type="date" id="tanggalOpname">
  <div style="display:flex; gap:10px; flex-wrap:wrap">
    <button class="btn-aksi" onclick="simpanOpname()">💾 Simpan Opname</button>
    <button class="btn-aksi" onclick="exportExcel()">📤 Export Excel</button>
    <button class="btn-aksi" onclick="window.print()">🖨️ Print PDF</button>
    <button class="btn-aksi" onclick="backupDrive()" style="background:#4285F4">☁️ Backup Drive</button>
  </div>

  <h3>📜 Riwayat Opname</h3>
  <div class="filter"><input type="date" id="tanggalRiwayat"><button onclick="loadRiwayat()">📂 Lihat</button><button onclick="hapusRiwayat()">🗑️ Hapus</button></div>
  <div id="infoRiwayat"></div>
  <table id="tabelBarang"></table>
  <div class="total" id="totalStok"></div>
</div>

<script>
// GANTI DENGAN FIREBASE CONFIG PUNYA OM
const firebaseConfig = {
  apiKey: "GANTI_DISINI",
  authDomain: "GANTI_DISINI",
  projectId: "GANTI_DISINI",
  storageBucket: "GANTI_DISINI",
  messagingSenderId: "GANTI_DISINI",
  appId: "GANTI_DISINI"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
let currentUser = null;
let dataBarang = [];
let html5QrcodeScanner = null;

// DARK MODE
function toggleDark(){ document.body.classList.toggle('dark'); localStorage.setItem('theme', document.body.classList.contains('dark')? 'dark' : 'light'); }
window.onload = () => { if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark'); }

// AUTH FIREBASE
function register(){
  let email = document.getElementById('email').value;
  let pass = document.getElementById('password').value;
  let role = document.getElementById('role').value;
  auth.createUserWithEmailAndPassword(email, pass).then(res => {
    db.collection('users').doc(res.user.uid).set({email, role});
    alert('Daftar berhasil!');
  }).catch(e => alert(e.message));
}
function login(){
  let email = document.getElementById('email').value;
  let pass = document.getElementById('password').value;
  auth.signInWithEmailAndPassword(email, pass).then(res => {
    db.collection('users').doc(res.user.uid).get().then(doc => {
      currentUser = {uid: res.user.uid, ...doc.data()};
      document.getElementById('loginPage').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      document.getElementById('userInfo').innerText = `Login: ${currentUser.email} - Role: ${currentUser.role}`;
      if(currentUser.role!== 'admin') document.getElementById('formTambah').classList.add('hidden');
      loadBarang();
    })
  }).catch(e => document.getElementById('loginError').innerText = e.message);
}
function logout(){ auth.signOut(); location.reload(); }

// BARCODE SCANNER
function startScanner(){
  document.getElementById('reader').classList.remove('hidden');
  html5QrcodeScanner = new Html5Qrcode("reader");
  html5QrcodeScanner.start({facingMode:"environment"}, {fps:10}, (code)=>{
    document.getElementById('kodeBarang').value = code;
    html5QrcodeScanner.stop();
    document.getElementById('reader').classList.add('hidden');
  });
}

// CRUD FIRESTORE
function loadBarang(){
  db.collection('barang').where('uid','==',currentUser.uid).onSnapshot(snap => {
    dataBarang = []; snap.forEach(doc => dataBarang.push({id:doc.id, ...doc.data()}));
    tampilkan();
  });
}
function simpanBarang(){
  if(currentUser.role === 'viewer') return alert('No akses!');
  let data = {
    kategori: document.getElementById('kategoriBarang').value,
    kode: document.getElementById('kodeBarang').value,
    nama: document.getElementById('namaBarang').value,
    stokSistem: Number(document.getElementById('stokSistem').value),
    stokFisik: 0, uid: currentUser.uid
  };
  let id = document.getElementById('editId').value;
  if(id) db.collection('barang').doc(id).update(data);
  else db.collection('barang').add(data);
  batalEdit();
}
function tampilkan(){ /* sama seperti sebelumnya, loop dataBarang */ }
function backupDrive(){ alert('Fitur backup ke Google Drive butuh Google API. Nanti kita bikin terpisah ya om. Sementara pake Export Excel dulu'); }

// Sisanya fungsi: edit, hapus, simpanOpname, loadRiwayat sama seperti versi sebelumnya tapi pake Firestore
document.getElementById('tanggalOpname').valueAsDate = new Date();
</script>
</body>
</html>
