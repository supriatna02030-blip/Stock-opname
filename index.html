<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Opname Toko</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

  <div id="loginPage" class="flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
      <h1 class="text-2xl font-bold mb-6 text-center">🔐 Login Stock Opname</h1>
      <input id="email" type="email" placeholder="Email" class="w-full p-2 border rounded mb-4">
      <input id="password" type="password" placeholder="Password" class="w-full p-2 border rounded mb-4">
      <button onclick="login()" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600">Masuk</button>
      <p id="error" class="text-red-500 text-sm mt-2"></p>
    </div>
  </div>

  <div id="dashboard" class="hidden p-6">
    <div class="flex justify-between mb-4">
      <h1 class="text-2xl font-bold">Dashboard Stock Opname</h1>
      <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded">Logout</button>
    </div>
    <div class="bg-white p-4 rounded shadow">
      <h2 class="font-bold mb-2">Tambah Barang</h2>
      <input id="namaBarang" placeholder="Nama Barang" class="border p-2 rounded mr-2">
      <input id="jumlah" type="number" placeholder="Jumlah" class="border p-2 rounded mr-2">
      <button onclick="simpanData()" class="bg-green-500 text-white px-4 py-2 rounded">Simpan</button>
    </div>
    <div id="listBarang" class="mt-4"></div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC-_iqLOETBc0CA_i-nQXqiZnFAbbVy_aE",
    authDomain: "stock-opname-om.firebaseapp.com",
    projectId: "stock-opname-om",
    storageBucket: "stock-opname-om.firebasestorage.app",
    messagingSenderId: "419566416384",
    appId: "1:419566416384:web:ab8089e297e29888e65ee5"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth();
  const db = getFirestore();

  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('loginPage').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      loadData();
    } else {
      document.getElementById('loginPage').classList.remove('hidden');
      document.getElementById('dashboard').classList.add('hidden');
    }
  });

  window.login = () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    signInWithEmailAndPassword(auth, email, password)
      .catch(error => document.getElementById('error').innerText = error.message);
  }

  window.logout = () => signOut(auth);

  window.simpanData = async () => {
    const nama = document.getElementById('namaBarang').value;
    const jumlah = document.getElementById('jumlah').value;
    await addDoc(collection(db, "stock"), {nama, jumlah, tanggal: new Date()});
    alert('Data tersimpan!');
    document.getElementById('namaBarang').value = '';
    document.getElementById('jumlah').value = '';
    loadData();
  }

  async function loadData() {
    const querySnapshot = await getDocs(collection(db, "stock"));
    let html = '';
    querySnapshot.forEach((doc) => {
      html += `<div class="bg-white p-2 mb-2 rounded">${doc.data().nama} - ${doc.data().jumlah}</div>`;
    });
    document.getElementById('listBarang').innerHTML = html;
  }
</script>
</body>
</html>
