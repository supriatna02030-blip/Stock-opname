<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Opname Benspot</title>
<style>
  body{font-family:Arial; padding:10px; background:#f5f5f5}
  .container{max-width:1000px; margin:auto; background:white; padding:20px; border-radius:10px}
  .btn{padding:10px 15px; border:none; border-radius:8px; cursor:pointer; margin:5px; font-weight:bold}
  .btn-hijau{background:#22c55e; color:white}
  .btn-biru{background:#3b82f6; color:white}
  table{width:100%; border-collapse:collapse; background:white; margin-top:15px}
  th,td{border:1px solid #ddd; padding:8px; text-align:center}
  th{background:#2c3e50; color:white}
  input{width:80px; text-align:center}
  #listRiwayat button{width:100%; text-align:left; padding:10px; margin:3px 0; background:#ecf0f1; border:1px solid #bdc3c7; border-radius:5px; cursor:pointer}
</style>
</head>
<body>
<div class="container">
<h2>📦 STOCK OPNAME BENSPOT</h2>

<input type="date" id="tanggal" style="padding:10px; width:100%; margin-bottom:10px;">
<button class="btn btn-hijau" onclick="loadTemplate()">📥 Load Template Benspot 57 Item</button>
<button class="btn btn-biru" onclick="simpanOpname()">💾 Simpan Opname</button>
<button class="btn btn-biru" onclick="exportExcel()">📊 Export Excel</button>

<table id="tabelBarang">
<thead>
<tr><th>No</th><th>Kategori</th><th>Nama Barang</th><th>Stok Sistem</th><th>Stok Fisik</th><th>Selisih</th></tr>
</thead>
<tbody></tbody>
</table>

<h3>📜 Riwayat Opname</h3>
<div id="listRiwayat"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// === OM ISI 57 ITEM BENSPOT DI SINI YA ===
const templateBenspot = [
  {no:1, kat:"RPC", nama:"RPC Monin Strawberry", sistem:0},
  {no:2, kat:"RPC", nama:"RPC Monin Mango", sistem:0},
  {no:3, kat:"RPC", nama:"RPC Monin Vanilla", sistem:0},
  // LANJUTIN SAMPAI 57 OM... CONTOH:
  {no:57, kat:"RAW", nama:"RAW Choco Hazelnut", sistem:0}
];

function loadTemplate(){
  let tbody = document.querySelector("#tabelBarang tbody");
  tbody.innerHTML = "";
  templateBenspot.forEach((item, i)=>{
    tbody.innerHTML += `<tr>
      <td>${item.no}</td>
      <td>${item.kat}</td>
      <td>${item.nama}</td>
      <td><input type="number" value="${item.sistem}" id="sistem${i}" oninput="hitung(${i})"></td>
      <td><input type="number" value="0" id="fisik${i}" oninput="hitung(${i})"></td>
      <td id="selisih${i}">0</td>
    </tr>`;
  });
}

function hitung(i){
  let sistem = parseInt(document.getElementById("sistem"+i).value) || 0;
  let fisik = parseInt(document.getElementById("fisik"+i).value) || 0;
  document.getElementById("selisih"+i).innerText = fisik - sistem;
}

function simpanOpname(){
  let tanggal = document.getElementById("tanggal").value;
  if(!tanggal) return alert("Pilih tanggal dulu!");
  
  let data = [];
  templateBenspot.forEach((item, i)=>{
    let sistem = parseInt(document.getElementById("sistem"+i).value) || 0;
    let fisik = parseInt(document.getElementById("fisik"+i).value) || 0;
    let selisih = fisik - sistem;
    data.push({...item, sistem, fisik, selisih});
  });

  let riwayat = JSON.parse(localStorage.getItem('riwayatBenspot')) || [];
  riwayat = riwayat.filter(item => item.tanggal !== tanggal);
  riwayat.push({ tanggal, data, waktu: new Date().toLocaleString() });
  riwayat.sort((a,b) => new Date(b.tanggal) - new Date(a.tanggal));
  localStorage.setItem('riwayatBenspot', JSON.stringify(riwayat));

  tampilkanRiwayat();
  alert("Data tanggal "+tanggal+" berhasil disimpan!");
}

function tampilkanRiwayat() {
  let riwayat = JSON.parse(localStorage.getItem('riwayatBenspot')) || [];
  let html = riwayat.length === 0 ? '<p>Belum ada riwayat</p>' : '';
  riwayat.forEach(item => {
    html += `<button onclick="loadRiwayat('${item.tanggal}')">📅 ${item.tanggal} - ${item.waktu}</button>`;
  });
  document.getElementById('listRiwayat').innerHTML = html;
}

function loadRiwayat(tanggal){
  let riwayat = JSON.parse(localStorage.getItem('riwayatBenspot')) || [];
  let item = riwayat.find(r => r.tanggal === tanggal);
  if(!item) return;
  document.getElementById("tanggal").value = tanggal;
  let tbody = document.querySelector("#tabelBarang tbody");
  tbody.innerHTML = "";
  item.data.forEach((d, i)=>{
    tbody.innerHTML += `<tr>
      <td>${d.no}</td>
      <td>${d.kat}</td>
      <td>${d.nama}</td>
      <td><input type="number" value="${d.sistem}" id="sistem${i}" oninput="hitung(${i})"></td>
      <td><input type="number" value="${d.fisik}" id="fisik${i}" oninput="hitung(${i})"></td>
      <td id="selisih${i}">${d.selisih}</td>
    </tr>`;
  });
}

function exportExcel(){
  let wb = XLSX.utils.table_to_book(document.getElementById('tabelBarang'));
  XLSX.writeFile(wb, `SO-BENSPOT-${document.getElementById("tanggal").value}.xlsx`);
}

window.onload = tampilkanRiwayat;
</script>
</body>
</html>
