<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Opname ULTIMATE</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{ --bg1:#667eea; --bg2:#764ba2; }
*{font-family:'Poppins',sans-serif; box-sizing:border-box;}
body{background:linear-gradient(135deg,var(--bg1),var(--bg2)); margin:0; padding:20px; color:#333;}
.container{max-width:800px; margin:auto; background:white; padding:20px; border-radius:15px; box-shadow:0 10px 30px rgba(0,0,0,0.2);}
h1{text-align:center; color:var(--bg2);}
input,select,button{width:100%; padding:12px; margin:8px 0; border-radius:8px; border:1px solid #ddd; font-size:14px;}
button{background:linear-gradient(135deg,var(--bg1),var(--bg2)); color:white; border:none; font-weight:600; cursor:pointer;}
button:hover{opacity:0.9;}
.btn-green{background:#28a745;}.btn-blue{background:#007bff;}.btn-red{background:#dc3545;}
.card{padding:15px; border-radius:10px; background:#f8f9fa; margin-top:15px;}
.hidden{display:none;}
table{width:100%; border-collapse:collapse; font-size:12px;}
th,td{border:1px solid #ddd; padding:8px; text-align:left;}
th{background:#667eea; color:white;}
</style>
</head>
<body>
<div class="container">
    <h1>📦 STOCK OPNAME PRO MAX</h1>
    
    <div class="card">
        <h3>Form Tambah Barang</h3>
        <input type="text" id="namaBarang" placeholder="Nama Barang">
        <input type="number" id="stokAwal" placeholder="Stok Awal">
        <button onclick="tambahBarang()">+ Tambah / Update</button>
    </div>

    <div class="card">
        <h3>Form Stock Opname</h3>
        <input type="text" id="cari" placeholder="🔍 Cari..." onkeyup="tampilkanBarang()">
        <select id="filterKategori"><option value="Semua">Semua</option></select>
        <input type="date" id="tanggalOpname" value="2026-08-09">
        <button class="btn-green" onclick="simpanOpname()">💾 Simpan Opname</button>
        <button class="btn-blue" onclick="exportCSV()">📊 Export Excel</button>
    </div>
    
    <div class="card">
        <h3>📜 Riwayat Opname</h3>
        <select id="filterRiwayat"></select>
        <button class="btn-blue" onclick="lihatRiwayat()">📁 Lihat</button>
        <button class="btn-red" onclick="hapusRiwayat()">🗑️ Hapus</button>
        <div id="tabelRiwayat" style="overflow-x:auto; margin-top:10px;"></div>
    </div>
</div>

<script>
let dataBarang = JSON.parse(localStorage.getItem('dataBarang')) || [];
let dataOpname = JSON.parse(localStorage.getItem('dataOpname')) || [];

function save() {
    localStorage.setItem('dataBarang', JSON.stringify(dataBarang));
    localStorage.setItem('dataOpname', JSON.stringify(dataOpname));
}

function tambahBarang(){
    const nama = document.getElementById('namaBarang').value;
    const stok = document.getElementById('stokAwal').value;
    if(nama==''||stok==''){alert('Isi semua!');return;}
    dataBarang.push({id:Date.now(), nama, stok});
    save(); alert('Barang ditambah!');
    document.getElementById('namaBarang').value='';
    document.getElementById('stokAwal').value='';
    tampilkanBarang();
}

function simpanOpname(){
    const tgl = document.getElementById('tanggalOpname').value;
    if(dataBarang.length==0){alert('Data barang kosong!');return;}
    dataOpname.push({tanggal:tgl, data: dataBarang});
    save(); alert('Opname tanggal '+tgl+' berhasil disimpan!');
    updateFilterRiwayat();
}

function lihatRiwayat(){
    const tgl = document.getElementById('filterRiwayat').value;
    const hasil = dataOpname.find(d=>d.tanggal==tgl);
    let html = '<table><tr><th>Nama Barang</th><th>Stok</th></tr>';
    if(hasil){
        hasil.data.forEach(b=>{
            html += `<tr><td>${b.nama}</td><td>${b.stok}</td></tr>`;
        })
    }else{ html='<p>Data tidak ada</p>' }
    html+='</table>';
    document.getElementById('tabelRiwayat').innerHTML=html;
}

function hapusRiwayat(){
    const tgl = document.getElementById('filterRiwayat').value;
    if(confirm('Hapus data tanggal '+tgl+'?')){
        dataOpname = dataOpname.filter(d=>d.tanggal!=tgl);
        save(); updateFilterRiwayat(); lihatRiwayat();
    }
}

function updateFilterRiwayat(){
    const sel = document.getElementById('filterRiwayat');
    sel.innerHTML='';
    [...new Set(dataOpname.map(d=>d.tanggal))].forEach(t=>{
        sel.innerHTML+=`<option value="${t}">${t}</option>`
    })
}

function exportCSV(){
    let csv = 'Tanggal,Nama,Stok\n';
    dataOpname.forEach(d=>{
        d.data.forEach(b=>{
            csv += `${d.tanggal},${b.nama},${b.stok}\n`
        })
    })
    const blob = new Blob([csv],{type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'riwayat-opname.csv';
    a.click();
}

function tampilkanBarang(){ /* bisa ditambahin nanti */ }
updateFilterRiwayat();
</script>
</body>
</html>
